<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../styles/style-desktop.css">
    <link rel="stylesheet" href="../styles/style-tablet.css">
    <link rel="stylesheet" href="../styles/style-smartphone.css">
    <title>Document</title>
</head>
<body>

<div id="form-block">
    <h2>Test</h2>
    <div id="enter-block">
        <label for="input-pair">Name/Value Pair</label>
        <div id="input-block">
            <input type="text" id="input-pair">
            <button id="add-button">Add</button>
        </div>
    </div>
    <div id="date-block">
        <label for="pairs-list">Name/Value Pair List</label>
        <div id="output-pair-block">
            <select id="pairs-list" multiple></select>
            <div id="control-output-block">
                <button id="sort_by_name-button">Sort by Name</button>
                <button id="sort_by_value-button">Sort by Value</button>
                <button id="delete-button">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="../scripts/script.js"></script>
</body>
</html>
