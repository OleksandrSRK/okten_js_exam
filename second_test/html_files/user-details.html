<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../styles/user-details_style.css">
    <title>Document</title>
</head>
<body>

<section id="user-details" class="user-details">
    <h1>User details</h1>

    <div class="containers">
        <h3 id="user-id-name">-</h3>
    </div>

    <button id="back-button">Back</button>

    <div class="containers">
        <p class="info-title-string">User information:</p>
        <p id="user-info" class="text-info">-</p>
    </div>

    <div class="containers">
        <p class="info-title-string">User address:</p>
        <p id="user-address" class="text-info">-</p>
    </div>

    <div class="containers">
        <p class="info-title-string">User company:</p>
        <p id="user-company" class="text-info">-</p>
    </div>
</section>

<button id="show-posts-button">Posts of current user</button>

<section id="user-posts"></section>


<script src="../scripts/user-details_script.js"></script>
</body>
</html>
